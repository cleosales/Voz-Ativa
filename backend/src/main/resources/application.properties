spring.application.name=vozativa

# Porta: o Render injeta PORT; localmente usa 8080
server.port=${PORT:8080}

# Respeita os headers do proxy do Render
server.forward-headers-strategy=framework

# Banco Oracle - valores vêm das variáveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno para evitar muitas conexões simultâneas
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1